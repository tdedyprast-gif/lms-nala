# deploy/nginx/default.conf
# ═══════════════════════════════════════════════════════════════════
# Vhost: HTTPS + Security Headers + Reverse Proxy
# ═══════════════════════════════════════════════════════════════════

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name circlo.dwijacode.my.id;

    # ACME challenge untuk Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name circlo.dwijacode.my.id;

    # ─── SSL Certificates ───
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_trusted_certificate /etc/nginx/certs/chain.pem;

    # ─── Security Headers (Enterprise) ───
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    
    # Content Security Policy (sesuaikan dengan kebutuhan React)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://circlo.dwijacode.my.id; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # ─── Rate Limit ───
    limit_req zone=general burst=50 nodelay;
    limit_conn conn_limit 20;

    # ─── Timeouts ───
    client_body_timeout   12;
    client_header_timeout 12;
    keepalive_timeout     65;

    # ─── Block common exploit patterns ───
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* (\.git|\.svn|\.hg|\.env|composer\.(json|lock)|package\.json|yarn\.lock) {
        deny all;
        access_log off;
    }

    # ─── Health endpoint (unauthenticated) ───
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ─── API Proxy ───
    location /api/ {
        # Rate limit khusus API
        limit_req zone=api_limit burst=20 nodelay;

        # Auth endpoints dapat limit lebih ketat
        location ~ ^/api/(auth|login|register) {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://backend:8000;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy_params.conf;

        # Timeout lebih ketat untuk API
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ─── Static assets (React build) — Cache agresif ───
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        proxy_pass http://frontend:8080;
        include /etc/nginx/conf.d/proxy_params.conf;
        
        proxy_cache static_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── React SPA — fallback ke index.html ───
    location / {
        proxy_pass http://frontend:8080;
        include /etc/nginx/conf.d/proxy_params.conf;
        
        # index.html tidak di-cache agar update langsung terlihat
        proxy_cache_bypass $http_upgrade;
    }

    # ─── Error pages ───
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}