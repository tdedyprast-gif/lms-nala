# deploy/nginx/nginx.conf
# ═══════════════════════════════════════════════════════════════════
# Nginx Main Config — Enterprise Grade
# ═══════════════════════════════════════════════════════════════════

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

pid /var/run/nginx.pid;

# Error log
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    # ═══════════════════════════════════════════════════════════════
    # MIME Types
    # ═══════════════════════════════════════════════════════════════
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ═══════════════════════════════════════════════════════════════
    # Hide Nginx version (SECURITY)
    # ═══════════════════════════════════════════════════════════════
    server_tokens off;

    # ═══════════════════════════════════════════════════════════════
    # Logging (JSON format untuk centralized logging)
    # ═══════════════════════════════════════════════════════════════
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time"'
        '}';

    access_log  /var/log/nginx/access.log  json_combined;

    # ═══════════════════════════════════════════════════════════════
    # Performance
    # ═══════════════════════════════════════════════════════════════
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 64;

    # Timeouts (proteksi slowloris)
    client_body_timeout     12;
    client_header_timeout   12;
    send_timeout            10;
    reset_timedout_connection on;

    # Body size (batasi upload)
    client_max_body_size    10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ═══════════════════════════════════════════════════════════════
    # Gzip Compression
    # ═══════════════════════════════════════════════════════════════
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ═══════════════════════════════════════════════════════════════
    # SSL/TLS (Modern Configuration)
    # ═══════════════════════════════════════════════════════════════
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;
    ssl_stapling         on;
    ssl_stapling_verify  on;
    resolver             1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout     5s;

    # DH parameters (generate dengan: openssl dhparam -out dhparam.pem 2048)
    # ssl_dhparam /etc/nginx/certs/dhparam.pem;

    # ═══════════════════════════════════════════════════════════════
    # Rate Limiting Zones
    # ═══════════════════════════════════════════════════════════════
    limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m  rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general:10m     rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ═══════════════════════════════════════════════════════════════
    # Cache
    # ═══════════════════════════════════════════════════════════════
    proxy_cache_path /var/cache/nginx/static
                     levels=1:2
                     keys_zone=static_cache:10m
                     max_size=500m
                     inactive=60m
                     use_temp_path=off;

    # ═══════════════════════════════════════════════════════════════
    # Include vhost
    # ═══════════════════════════════════════════════════════════════
    include /etc/nginx/conf.d/*.conf;
}