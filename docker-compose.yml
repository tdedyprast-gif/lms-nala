# docker-compose.yml
# ═══════════════════════════════════════════════════════════════════
# lms-circlo Empowerment — Production Stack
# Security Level: Enterprise
# ═══════════════════════════════════════════════════════════════════

services:
  # ═══════════════════════════════════════════════════════════════
  # MONGO — Database (internal only)
  # ═══════════════════════════════════════════════════════════════
  mongo:
    image: mongo:4.4
    container_name: lms-circlo-mongo
    restart: unless-stopped
    command: >
      mongod --auth --bind_ip_all --wiredTigerCacheSizeGB 0.25 --noscripting
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_user
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_INITDB_DATABASE: ${DB_NAME:-lms-circlo_empowerment}
    secrets:
      - mongo_root_user
      - mongo_root_password
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - lms-circlo-internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongo --quiet --username "$$(cat /run/secrets/mongo_root_user)" --password "$$(cat /run/secrets/mongo_root_password)" --authenticationDatabase admin --eval "db.adminCommand('ping').ok"      
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════════════
  # BACKEND — FastAPI (public + internal)
  # ═══════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: lms-circlo-backend:${IMAGE_TAG:-latest}
    container_name: lms-circlo-backend
    ports:
      - "127.0.0.1:8003:8003"
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: >
      sh -c '
        export MONGO_URL=$$(cat /run/secrets/mongo_url);
        export JWT_SECRET=$$(cat /run/secrets/jwt_secret);
        export ADMIN_PASSWORD=$$(cat /run/secrets/admin_password);
        export RESEND_API_KEY=$$(cat /run/secrets/resend_api_key);
        exec uvicorn server:app --host 0.0.0.0 --port 8003 --workers 1 --proxy-headers --forwarded-allow-ips "*" --no-server-header
      '
    environment:
      DB_NAME: ${DB_NAME:-lms-circlo_empowerment}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      CORS_ORIGINS: ${FRONTEND_ORIGIN}
      SENDER_EMAIL: ${SENDER_EMAIL}
      ENVIRONMENT: production
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      # hapus semua *_FILE karena sudah di-handle di entrypoint
    secrets:
      - mongo_url
      - jwt_secret
      - admin_password
      - resend_api_key
    networks:
      - lms-circlo-internal
      - lms-circlo-public
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          try:
              urllib.request.urlopen('http://127.0.0.1:8003/api/', timeout=3)
          except Exception as e:
              sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # ═══════════════════════════════════════════════════════════════
  # FRONTEND — React static (internal)
  # ═══════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    image: lms-circlo-frontend:${IMAGE_TAG:-latest}
    container_name: lms-circlo-frontend
    ports:
      - "127.0.0.1:3002:80"
    restart: unless-stopped
    networks:
      - lms-circlo-internal
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ═══════════════════════════════════════════════════════════════
# NETWORKS
# ═══════════════════════════════════════════════════════════════
networks:
  lms-circlo-public:
    driver: bridge
    internal: false
  lms-circlo-internal:
    driver: bridge
    internal: true

# ═══════════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════════
volumes:
  mongo_data:
  mongo_config:
  nginx_cache:

    # ═══════════════════════════════════════════════════════════════
    # SECRETS (Enterprise-grade)
    # ═══════════════════════════════════════════════════════════════
secrets:
  mongo_root_user:
    file: ./secrets/mongo_root_user.txt
  mongo_root_password:
    file: ./secrets/mongo_root_password.txt
  mongo_url:
    file: ./secrets/mongo_url.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  admin_password:
    file: ./secrets/admin_password.txt
  resend_api_key:
    file: ./secrets/resend_api_key.txt
