# docker-compose.yml
# ═══════════════════════════════════════════════════════════════════
# lms-circlo Empowerment — Production Stack
# Security Level: Enterprise
# ═══════════════════════════════════════════════════════════════════

services:
  # ═══════════════════════════════════════════════════════════════
  # POSTGRES — Database (internal only)
  # ═══════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: lms-circlo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER_FILE: /run/secrets/mongo_root_user
      POSTGRES_PASSWORD_FILE: /run/secrets/mongo_root_password
      POSTGRES_DB: ${DB_NAME:-lms-circlo_empowerment}
    secrets:
      - mongo_root_user
      - mongo_root_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # networks DIHAPUS — pakai default bridge
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$(cat /run/secrets/mongo_root_user)" -d "${DB_NAME:-lms-circlo_empowerment}"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════════════
  # BACKEND — FastAPI
  # ═══════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: lms-circlo-backend:${IMAGE_TAG:-latest}
    container_name: lms-circlo-backend
    ports:
      - "127.0.0.1:8003:8003"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      sh -c '
        export MONGO_URL=$$(cat /run/secrets/mongo_url);
        export JWT_SECRET=$$(cat /run/secrets/jwt_secret);
        export ADMIN_PASSWORD=$$(cat /run/secrets/admin_password);
        export RESEND_API_KEY=$$(cat /run/secrets/resend_api_key);
        exec uvicorn server:app --host 0.0.0.0 --port 8003 --workers 1 --proxy-headers --forwarded-allow-ips "*" --no-server-header
      '
    environment:
      DB_NAME: ${DB_NAME:-lms-circlo_empowerment}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      CORS_ORIGINS: ${FRONTEND_ORIGIN}
      SENDER_EMAIL: ${SENDER_EMAIL}
      ENVIRONMENT: production
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    secrets:
      - mongo_url
      - jwt_secret
      - admin_password
      - resend_api_key
    # networks DIHAPUS — pakai default bridge
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          try:
              urllib.request.urlopen('http://127.0.0.1:8003/api/', timeout=3)
          except Exception as e:
              sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════════════
  # FRONTEND — React static
  # ═══════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    image: lms-circlo-frontend:${IMAGE_TAG:-latest}
    container_name: lms-circlo-frontend
    ports:
      - "127.0.0.1:3002:80"
    restart: unless-stopped
    # networks DIHAPUS — pakai default bridge
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ═══════════════════════════════════════════════════════════════
# NETWORKS — DIHAPUS (pakai default bridge)
# ═══════════════════════════════════════════════════════════════
# networks:
#   lms-circlo-public:
#     driver: bridge
#     internal: false
#   lms-circlo-internal:
#     driver: bridge
#     internal: true

# ═══════════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════════
volumes:
  postgres_data:
  nginx_cache:

    # ═══════════════════════════════════════════════════════════════
    # SECRETS
    # ═══════════════════════════════════════════════════════════════
secrets:
  mongo_root_user:
    file: ./secrets/mongo_root_user.txt
  mongo_root_password:
    file: ./secrets/mongo_root_password.txt
  mongo_url:
    file: ./secrets/mongo_url.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  admin_password:
    file: ./secrets/admin_password.txt
  resend_api_key:
    file: ./secrets/resend_api_key.txt
